<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sky Twilight & Golden Hour Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180e22" />
      <stop offset="30%" stop-color="#3d1b32" />
      <stop offset="55%" stop-color="#7a2d36" />
      <stop offset="75%" stop-color="#c9582d" />
      <stop offset="90%" stop-color="#e88f34" />
      <stop offset="100%" stop-color="#fdd182" />
    </linearGradient>

    <!-- Golden Setting Sun Radial Halo -->
    <radialGradient id="sunCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#fed679" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#e27c2b" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#bd4928" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#180e22" stop-opacity="0" />
    </radialGradient>

    <!-- Bosphorus Water Depth Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a3c26" />
      <stop offset="15%" stop-color="#542129" />
      <stop offset="45%" stop-color="#2a1424" />
      <stop offset="80%" stop-color="#140b17" />
      <stop offset="100%" stop-color="#09050b" />
    </linearGradient>

    <!-- Water Surface Shimmer Line Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e88f34" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffd580" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#fff3d1" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#ffd580" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e88f34" stop-opacity="0" />
    </linearGradient>

    <!-- Archival Corner Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="50%" stop-color="#000" stop-opacity="0" />
      <stop offset="85%" stop-color="#000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.65" />
    </radialGradient>

    <!-- Cloud Soft Rose Highlight Gradient -->
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e2d3e" stop-opacity="0" />
      <stop offset="50%" stop-color="#d46b45" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6e2d3e" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- 1. SKY BACKGROUND -->
  <rect x="0" y="0" width="800" height="340" fill="url(#skyGrad)" />

  <!-- 2. SOFT VINTAGE CLOUDS -->
  <path d="M-50 140 Q 80 120, 200 135 T 450 125 T 700 140 T 850 130 L 850 190 L -50 190 Z" fill="url(#cloudGrad1)" />
  <path d="M50 80 Q 220 60, 380 75 T 680 70 T 850 85 L 850 120 L 50 120 Z" fill="url(#cloudGrad1)" opacity="0.5" />
  <path d="M-20 185 Q 150 170, 320 180 T 600 175 T 820 185 L 820 220 L -20 220 Z" fill="url(#cloudGrad1)" opacity="0.6" />

  <!-- 3. SETTING SUN & LUMINOUS HALO -->
  <circle cx="520" cy="225" r="160" fill="url(#sunCorona)" />
  <circle cx="520" cy="225" r="50" fill="#fed679" opacity="0.75" />
  <circle cx="520" cy="225" r="28" fill="#fff7e0" />

  <!-- 4. DISTANT HISTORIC PENINSULA SILHOUETTE (Sultanahmet / Asian Hills) -->
  <path d="M380 280 Q 420 274, 460 275 L 468 275 L 469 240 L 471 240 L 472 275 Q 485 272, 500 268 Q 512 260, 520 268 L 522 268 L 523 235 L 525 235 L 526 268 Q 540 270, 560 274 L 568 274 L 569 242 L 571 242 L 572 274 Q 600 275, 650 282 Q 720 285, 800 290 L 800 320 L 380 320 Z" fill="#38192a" opacity="0.65" />

  <!-- 5. MIDGROUND HISTORIC SULTANAHMET HORIZON (Hagia Sophia & Blue Mosque Minarets) -->
  <path d="M 430 295 Q 470 288, 510 288 L 512 288 L 513 248 L 514 235 L 515 248 L 516 288 Q 530 280, 545 288 L 547 288 L 548 245 L 549 232 L 550 245 L 551 288 Q 570 286, 610 292 L 611 292 L 612 255 L 613 255 L 614 292 Q 660 294, 750 305 L 800 310 L 800 330 L 430 330 Z" fill="#261222" opacity="0.85" />

  <!-- 6. FOREGROUND GALATA HILLSIDE & WATERFRONT SILHOUETTES -->
  <path d="M 0 315 L 0 240 Q 30 240, 60 245 L 80 230 L 110 230 L 120 250 L 150 248 L 165 238 L 180 238 L 195 252 L 215 245 L 230 255 L 245 248 L 260 260 L 290 255 L 320 270 L 350 275 L 375 285 L 410 295 L 440 315 L 0 315 Z" fill="#1a0c1a" />

  <!-- 7. GALATA TOWER (Iconic Architectural Silhouette) -->
  <path d="M 268 258 L 270 155 L 265 153 L 265 145 L 271 145 L 272 125 L 266 122 L 266 116 L 273 116 L 267 114 L 267 106 L 273 106 L 273 95 L 297 95 L 297 106 L 303 106 L 303 114 L 297 116 L 304 116 L 304 122 L 298 125 L 299 145 L 305 145 L 305 153 L 300 155 L 302 258 Z" fill="#120713" />
  <path d="M 270 95 L 285 45 L 300 95 Z" fill="#100611" />
  <line x1="285" y1="45" x2="285" y2="30" stroke="#100611" stroke-width="2" />
  <circle cx="285" cy="28" r="2.5" fill="#e89738" />

  <!-- Warm Glowing Arched Windows of Galata Tower -->
  <rect x="281" y="100" width="8" height="6" rx="3" fill="#ffe28a" opacity="0.9" />
  <rect x="282" y="128" width="6" height="8" rx="3" fill="#fdb849" opacity="0.85" />
  <rect x="283" y="165" width="5" height="9" rx="2.5" fill="#fdb849" opacity="0.75" />

  <!-- 8. BOSPHORUS STRAIT (WATER SURFACE) -->
  <rect x="0" y="310" width="800" height="190" fill="url(#waterGrad)" />

  <!-- 9. GOLDEN WATER REFLECTIONS & RIPPLES -->
  <ellipse cx="520" cy="318" rx="85" ry="3" fill="url(#shimmerGrad)" />
  <ellipse cx="515" cy="328" rx="120" ry="3.5" fill="url(#shimmerGrad)" />
  <ellipse cx="525" cy="339" rx="100" ry="3" fill="url(#shimmerGrad)" />
  <ellipse cx="510" cy="351" rx="140" ry="4" fill="url(#shimmerGrad)" />
  <ellipse cx="530" cy="365" rx="115" ry="3.5" fill="url(#shimmerGrad)" />
  <ellipse cx="505" cy="380" rx="160" ry="4.5" fill="url(#shimmerGrad)" />
  <ellipse cx="525" cy="398" rx="130" ry="4" fill="url(#shimmerGrad)" />
  <ellipse cx="495" cy="418" rx="180" ry="5" fill="url(#shimmerGrad)" />
  <ellipse cx="520" cy="440" rx="145" ry="4.5" fill="url(#shimmerGrad)" />
  <ellipse cx="490" cy="465" rx="200" ry="5.5" fill="url(#shimmerGrad)" />
  <ellipse cx="510" cy="488" rx="170" ry="5" fill="url(#shimmerGrad)" />

  <!-- Ambient Wavelets across the strait -->
  <path d="M 60 335 Q 120 333, 180 335 T 300 335" stroke="#c9582d" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 120 360 Q 200 357, 280 360 T 400 360" stroke="#c9582d" stroke-width="1.8" fill="none" opacity="0.35" />
  <path d="M 40 390 Q 150 387, 250 390 T 380 390" stroke="#d46b45" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M 180 430 Q 280 426, 380 430" stroke="#c9582d" stroke-width="2" fill="none" opacity="0.25" />
  <path d="M 620 345 Q 690 343, 760 345" stroke="#c9582d" stroke-width="1.5" fill="none" opacity="0.35" />
  <path d="M 650 385 Q 710 382, 780 385" stroke="#c9582d" stroke-width="1.8" fill="none" opacity="0.3" />

  <!-- 10. VINTAGE BOSPHORUS FERRY (Şehir Hatları Vapuru) -->
  <g transform="translate(130, 320)">
    <path d="M 0 22 L 12 30 L 85 30 L 98 22 L 95 18 L 5 18 Z" fill="#0d050e" />
    <path d="M 8 20 L 92 20 L 90 22 L 10 22 Z" fill="#e89738" opacity="0.6" />
    <path d="M 18 18 L 22 10 L 78 10 L 82 18 Z" fill="#140715" />
    <path d="M 32 10 L 34 4 L 66 4 L 68 10 Z" fill="#0d050e" />
    <rect x="47" y="-5" width="6" height="10" fill="#220b12" />
    <rect x="47" y="-7" width="6" height="2" fill="#c9582d" />
    <path d="M 50 -8 Q 45 -14, 38 -17 Q 30 -20, 22 -22" stroke="#fce29d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35" />
    <circle cx="28" cy="14" r="1.3" fill="#ffea88" />
    <circle cx="36" cy="14" r="1.3" fill="#ffea88" />
    <circle cx="44" cy="14" r="1.3" fill="#ffea88" />
    <circle cx="52" cy="14" r="1.3" fill="#ffea88" />
    <circle cx="60" cy="14" r="1.3" fill="#ffea88" />
    <circle cx="68" cy="14" r="1.3" fill="#ffea88" />
    <path d="M -3 27 Q 8 29, 20 28" stroke="#ffd580" stroke-width="1" fill="none" opacity="0.5" />
  </g>

  <!-- 11. ISTANBUL SEAGULLS (Martılar) -->
  <path d="M 430 140 Q 436 132, 442 136 Q 448 132, 454 140 Q 448 136, 442 139 Q 436 136, 430 140 Z" fill="#2d121c" />
  <path d="M 320 85 Q 325 79, 330 82 Q 335 79, 340 85 Q 335 82, 330 84 Q 325 82, 320 85 Z" fill="#1f0a14" />
  <path d="M 365 110 Q 371 103, 377 107 Q 383 103, 389 110 Q 383 106, 377 109 Q 371 106, 365 110 Z" fill="#2d121c" />
  <path d="M 480 115 Q 484 109, 488 112 Q 492 109, 496 115 Q 492 112, 488 114 Q 484 112, 480 115 Z" fill="#4a1e28" opacity="0.8" />
  <path d="M 230 290 Q 235 284, 240 287 Q 245 284, 250 290 Q 245 287, 240 289 Q 235 287, 230 290 Z" fill="#1a0a14" />
  <path d="M 160 95 Q 164 90, 168 92 Q 172 90, 176 95 Q 172 92, 168 94 Q 164 92, 160 95 Z" fill="#3a1824" opacity="0.75" />

  <!-- 12. ARCHIVAL CORNER VIGNETTE -->
  <rect x="0" y="0" width="800" height="500" fill="url(#vignette)" pointer-events="none" />
</svg>